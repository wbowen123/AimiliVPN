name: AimiliVPN CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-gate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Sing-box Kernel (1.14.3)
      run: |
        curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz | tar -xz --strip-components=1 -C /usr/local/bin/
        chmod +x /usr/local/bin/sing-box
        sing-box version

    - name: Install Static Analysis Tools (pyflakes, shellcheck)
      run: |
        pip install pyflakes
        sudo apt-get update -qq && sudo apt-get install -y shellcheck

    - name: Run AimiliVPN Code Gate V2.0 (AST, Scope, Topology, Sing-box Kernel Check)
      run: |
        python scripts/code_gate.py

    - name: Python Static Analysis (pyflakes)
      run: |
        pyflakes aimili_cli.py vpngate_manager.py scripts/

    - name: Shell Syntax Check (bash -n)
      run: |
        find scripts/ -name "*.sh" -exec bash -n {} +
        bash -n install.sh

    - name: Shell Static Analysis (shellcheck)
      run: |
        shellcheck -S error -e SC1091 scripts/*.sh install.sh

    - name: Python Bytecode Compilation Check (py_compile)
      run: |
        python -m compileall -q .

