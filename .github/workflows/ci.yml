name: AimiliVPN CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-gate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run AimiliVPN Code Gate (AST, Scope, Nginx, Topology)
      run: |
        python scripts/code_gate.py

    - name: Shell Syntax Check (bash -n)
      run: |
        find . -name "*.sh" -exec bash -n {} +
        bash -n install.sh

    - name: Python Bytecode Compilation Check (py_compile)
      run: |
        python -m compileall -q .
