server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/aimilivpn/tls/fullchain.pem;
    ssl_certificate_key /etc/aimilivpn/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    location /sub/ {
        alias /var/www/aimilivpn-sub/;
        default_type 'text/plain; charset=utf-8';
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 反向代理 VMess-xHTTP / WebSocket 流量至 Sing-box 8445 端口 (支持 CDN/Argo 破墙流量经 8443 入口进入)
    location ~ ^/(vmess|vmess-ws)$ {
        proxy_pass http://127.0.0.1:8445/vmess;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
    }
}

server {
    listen 18443 ssl;
    server_name _;

    ssl_certificate     /etc/aimilivpn/tls/fullchain.pem;
    ssl_certificate_key /etc/aimilivpn/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/aimilivpn-sub;
    default_type 'text/plain; charset=utf-8';
    add_header Cache-Control "no-store, no-cache, must-revalidate";

    location = / {
        try_files /sub.txt =404;
    }

    location ~ ^/(clash|clash\.yaml|clash\.yml)$ {
        try_files /clash.yaml =404;
        default_type 'text/yaml; charset=utf-8';
    }

    location ~ ^/(singbox|singbox\.json|sing-box\.json)$ {
        try_files /singbox.json =404;
        default_type 'application/json; charset=utf-8';
    }

    location ~ ^/(nodes|nodes\.txt)$ {
        try_files /nodes.txt =404;
        default_type 'text/plain; charset=utf-8';
    }

    location ~ ^/(sub|sub\.txt|subscribe)$ {
        try_files /sub.txt =404;
    }
}