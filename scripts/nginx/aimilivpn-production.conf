server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/aimilivpn/tls/fullchain.pem;
    ssl_certificate_key /etc/aimilivpn/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    location /sub/ {
        alias /var/www/aimilivpn-sub/;
        default_type 'text/plain; charset=utf-8';
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
    }
}

server {
    listen 18443 ssl;
    server_name _;

    ssl_certificate     /etc/aimilivpn/tls/fullchain.pem;
    ssl_certificate_key /etc/aimilivpn/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        root /var/www/aimilivpn-sub;
        try_files /sub.txt =404;
        default_type 'text/plain; charset=utf-8';
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~ ^/(sub|sub\.txt|subscribe)$ {
        root /var/www/aimilivpn-sub;
        try_files /sub.txt =404;
        default_type 'text/plain; charset=utf-8';
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}