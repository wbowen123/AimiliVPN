server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate     /etc/aimilivpn/tls/fullchain.pem;
    ssl_certificate_key /etc/aimilivpn/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # 当用户直接在浏览器输入域名端口 (默认走 HTTP) 时，自动平滑无缝重定向至 https://
    error_page 497 https://$host:8443$request_uri;

    location /sub/ {
        alias /var/www/aimilivpn-sub/;
        default_type 'text/plain; charset=utf-8';
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 反向代理 VMess-xHTTP / WebSocket 流量至 Sing-box 8445 端口 (支持 CDN/Argo 破墙流量经 8443 入口进入)
    location /vmess {
        proxy_pass http://127.0.0.1:8445/vmess;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /vmess-ws {
        proxy_pass http://127.0.0.1:8446/vmess-ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
    }
}

server {
    listen 18080;
    listen [::]:18080;
    listen 18443 ssl;
    listen [::]:18443 ssl;
    server_name _;

    ssl_certificate     /etc/aimilivpn/tls/fullchain.pem;
    ssl_certificate_key /etc/aimilivpn/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 当用户使用 plain HTTP 访问 18443 时，自动重定向至 https://
    error_page 497 https://$host:18443$request_uri;

    root /var/www/aimilivpn-sub;
    default_type 'text/plain; charset=utf-8';
    add_header Cache-Control "no-store, no-cache, must-revalidate";

    location = / {
        try_files /sub.txt =404;
    }

    location ~ ^/(clash|clash\.yaml|clash\.yml)$ {
        try_files /clash.yaml =404;
        default_type 'text/yaml; charset=utf-8';
    }

    location ~ ^/(singbox|singbox\.json|sing-box\.json)$ {
        try_files /singbox.json =404;
        default_type 'application/json; charset=utf-8';
    }

    location ~ ^/(nodes|nodes\.txt)$ {
        try_files /nodes.txt =404;
        default_type 'text/plain; charset=utf-8';
    }

    location ~ ^/(sub|sub\.txt|subscribe)$ {
        try_files /sub.txt =404;
    }

    location / {
        try_files $uri $uri/ /sub.txt =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/camouflage;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/aimilivpn-acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}